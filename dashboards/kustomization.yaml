apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true

configMapGenerator:
  - name: k8s-dashboard
    files:
      - k8s-dashboard.json
  - name: node-exporter-dashboard
    files:
      - node-exporter-dashboard.json
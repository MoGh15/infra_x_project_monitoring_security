tempo:
  reportingEnabled: false
  retention: 168h

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # OTLP receivers used by Alloy (chart also requires jaeger receivers)
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  # Service graph + span metrics are pushed to Prometheus (remote write receiver)
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
    registry:
      external_labels:
        source: tempo
    storage:
      path: /var/tempo/generator/wal

  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi

serviceMonitor:
  enabled: true

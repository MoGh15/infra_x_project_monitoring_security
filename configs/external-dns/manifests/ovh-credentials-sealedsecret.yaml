#GET on /domain/zone
#GET on /domain/zone/infra-x.cloud/recordd
#GET on /domain/zone/infra-x.cloud/record/*
#PUT on /domain/zone/infra-x.cloud/record/*
#POST on /domain/zone/infra-x.cloud/record
#DELETE on /domain/zone/infra-x.cloud/record/*
#GET on /domain/zone/infra-x.cloud/soa
#POST on /domain/zone/infra-x.cloud/refresh
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ovh-credentials
  namespace: external-dns
spec:
  encryptedData:
    OVH_APPLICATION_KEY: 
    OVH_APPLICATION_SECRET: 
    OVH_CONSUMER_KEY: 
  template:
    metadata:
      name: ovh-credentials
      namespace: external-dns
    type: Opaque

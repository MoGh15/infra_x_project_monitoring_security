# =============================================================================
# VORLAGE: OVH-API-Credentials als SealedSecret fuer external-dns
# -----------------------------------------------------------------------------
# Dieses SealedSecret wird vom external-dns ArgoCD-App (dritte Source: path
# configs/external-dns/manifests) deployt. Der sealed-secrets-Controller
# (bootstrap) entschluesselt es im Cluster zum Secret "ovh-credentials" im
# Namespace "external-dns", das external-dns via envFrom referenziert.
#
# Die Schluesselnamen sind die vom OVH-Provider erwarteten Environment-Variablen
# (OVH_APPLICATION_KEY / OVH_APPLICATION_SECRET / OVH_CONSUMER_KEY).
#
# WICHTIG: Die unten stehenden encryptedData-Werte sind PLATZHALTER und muessen
# neu erzeugt werden (sie sind an Name + Namespace gebunden):
#
#   # 1) Plain-Secret lokal bauen (NICHT committen!):
#   kubectl -n external-dns create secret generic ovh-credentials \
#     --from-literal=OVH_APPLICATION_KEY=DEINE_APP_KEY \
#     --from-literal=OVH_APPLICATION_SECRET=DEIN_APP_SECRET \
#     --from-literal=OVH_CONSUMER_KEY=DEIN_CONSUMER_KEY \
#     --dry-run=client -o yaml > /tmp/ovh-extdns.yaml
#
#   # 2) Mit dem Cluster-Public-Key versiegeln:
#   kubeseal --controller-name sealed-secrets-controller \
#            --controller-namespace sealed-secrets \
#            --format yaml < /tmp/ovh-extdns.yaml > \
#            configs/external-dns/manifests/ovh-credentials-sealedsecret.yaml
#
#   # 3) /tmp/ovh-extdns.yaml loeschen, die versiegelte Datei committen.
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ovh-credentials
  namespace: external-dns
spec:
  encryptedData:
    OVH_APPLICATION_KEY: REPLACE_WITH_SEALED_VALUE
    OVH_APPLICATION_SECRET: REPLACE_WITH_SEALED_VALUE
    OVH_CONSUMER_KEY: REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: ovh-credentials
      namespace: external-dns
    type: Opaque

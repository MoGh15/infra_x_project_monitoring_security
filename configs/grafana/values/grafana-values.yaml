ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.infra-x.cloud
    cert-manager.io/cluster-issuer: letsencrypt-ovh-prod

  path: /
  pathType: Prefix

  hosts:
    - grafana.infra-x.cloud

  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.infra-x.cloud

admin:
  existingSecret: "grafana-admin-password"
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              datasourceUid: tempo
              matcherType: regex
              matcherRegex: '(?:trace_?id|traceId)[":= ]+"?(\w+)'
              url: '$${__value.raw}'

      - name: prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: true
            tags:
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValues: "1"
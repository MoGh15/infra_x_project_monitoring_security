ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.infra-x.cloud
    cert-manager.io/cluster-issuer: letsencrypt-ovh-prod

  path: /
  pathType: Prefix

  hosts:
    - grafana.infra-x.cloud

  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.infra-x.cloud

adminUser: admin
adminPassword: testpassword
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.infra-x.cloud
    cert-manager.io/cluster-issuer: letsencrypt-ovh-prod

  path: /
  pathType: Prefix

  hosts:
    - grafana.infra-x.cloud

  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.infra-x.cloud

admin:
  existingSecret: "grafana-admin-password"
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        jsonData:
          timeInterval: 30s
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://prometheus-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

sidecar:
  # Laedt Dashboards automatisch aus ConfigMaps mit Label grafana_dashboard=1 (alle Namespaces),
  # z.B. das Praxis-Dashboard aus chart/templates/grafana-dashboard-configmap.yaml.
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

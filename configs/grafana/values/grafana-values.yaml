ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.infra-x.cloud
    cert-manager.io/cluster-issuer: letsencrypt-ovh-prod

  path: /
  pathType: Prefix

  hosts:
    - grafana.infra-x.cloud

  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.infra-x.cloud

admin:
  existingSecret: "grafana-admin-password"
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
# Common values for the sealed-secrets ArgoCD Application.
# Consumed via $values reference from argocd-bootstrap/apps sealed-secrets Application.
#
# The sealed-secrets controller lets you commit encrypted SealedSecret resources
# to git; it decrypts them in-cluster into regular Secrets. Deployed in the
# bootstrap layer so encrypted secrets (e.g. the OVH API credentials used by
# external-dns and cert-manager-webhook-ovh) can be managed via GitOps.

fullnameOverride: sealed-secrets-controller

# The controller must be reachable by `kubeseal` under a stable name.
resources:
  requests:
    cpu: 10m
    memory: 64Mi

metrics:
  serviceMonitor:
    enabled: false

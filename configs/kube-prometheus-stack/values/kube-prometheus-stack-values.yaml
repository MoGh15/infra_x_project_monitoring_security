# Grafana wird separat über die eigene "grafana"-Application deployt.
grafana:
  enabled: false

# OVH Managed Kubernetes: Control-Plane-Komponenten sind nicht scrapebar und
# würden sonst dauerhaft *Down-Alerts auslösen.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheus:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      external-dns.alpha.kubernetes.io/hostname: prometheus.infra-x.cloud
      cert-manager.io/cluster-issuer: letsencrypt-ovh-prod
      # Basic Auth (optional): Secret "prometheus-basic-auth" mit Key "auth"
      # (htpasswd-Format) als SealedSecret unter manifests/ anlegen und aktivieren.
      # nginx.ingress.kubernetes.io/auth-type: basic
      # nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
      # nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    hosts:
      - prometheus.infra-x.cloud
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.infra-x.cloud
  prometheusSpec:
    externalUrl: https://prometheus.infra-x.cloud
    retention: 15d
    # ServiceMonitors/PodMonitors/Rules aus allen Namespaces einsammeln,
    # nicht nur die mit dem Release-Label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      external-dns.alpha.kubernetes.io/hostname: alertmanager.infra-x.cloud
      cert-manager.io/cluster-issuer: letsencrypt-ovh-prod
      # Basic Auth (optional): Secret "alertmanager-basic-auth" mit Key "auth"
      # (htpasswd-Format) als SealedSecret unter manifests/ anlegen und aktivieren.
      # nginx.ingress.kubernetes.io/auth-type: basic
      # nginx.ingress.kubernetes.io/auth-secret: alertmanager-basic-auth
      # nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    hosts:
      - alertmanager.infra-x.cloud
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.infra-x.cloud
  alertmanagerSpec:
    externalUrl: https://alertmanager.infra-x.cloud
    # Wird unter /etc/alertmanager/secrets/alertmanager-smtp/ gemountet
    # (SealedSecret aus configs/kube-prometheus-stack/manifests).
    secrets:
      - alertmanager-smtp
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: infrax98@gmail.com
      smtp_auth_username: infrax98@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
      smtp_require_tls: true
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
    route:
      receiver: email
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: email
        email_configs:
          # Mehrere Empfänger kommagetrennt angeben, z.B. "a@x.de, b@y.de"
          - to: "mohammadghannam892@gmail.com"
            send_resolved: true
    templates:
      - "/etc/alertmanager/config/*.tmpl"

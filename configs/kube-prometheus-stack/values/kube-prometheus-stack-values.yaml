grafana:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

prometheus:

  ingress:
    enabled: true
      
    ingressClassName: nginx

    annotations:
      external-dns.alpha.kubernetes.io/hostname: prometheus.infra-x.cloud
      cert-manager.io/cluster-issuer: letsencrypt-ovh-prod


    hosts:
      - prometheus.infra-x.cloud

    paths:
      - /

    pathType: Prefix

    tls:
      - secretName: prometheus-general-tls
        hosts:
          - prometheus.infra-x.cloud
  
  prometheusSpec:
    externalUrl: https://prometheus.infra-x.cloud
    retention: 15d

    serviceMonitorSelectorNilUsesHelmValues: false

    podMonitorSelectorNilUsesHelmValues: false
    
    ruleSelectorNilUsesHelmValues: false
    
    probeSelectorNilUsesHelmValues: false

    storageSpec:

      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  ingress:
    enabled: true

    ingressClassName: nginx

    annotations:
      external-dns.alpha.kubernetes.io/hostname: alertmanager.infra-x.cloud
      cert-manager.io/cluster-issuer: letsencrypt-ovh-prod

    hosts:
      - alertmanager.infra-x.cloud

    paths:
      - /

    pathType: Prefix

    tls:
      - secretName: alertmanager-general-tls
        hosts:
          - alertmanager.infra-x.cloud

  alertmanagerSpec:
    externalUrl: https://alertmanager.infra-x.cloud
    secrets:
      - alertmanager-smtp
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'infrax98@gmail.com'
      smtp_auth_username: 'infrax98@gmail.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
      smtp_require_tls: true

    route:
      receiver: email
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname=~"Watchdog"

    receivers:
      - name: email
        email_configs:
          - to: 'example@gmail.com'
            send_resolved: true
        #   - to: 'hanin1990102@gmail.com'
        #     send_resolved: true
        #   - to: 'mohammadghannam892@gmail.com'
        #     send_resolved: true
      - name: "null"

    templates:
      - "/etc/alertmanager/config/*.tmpl"
  

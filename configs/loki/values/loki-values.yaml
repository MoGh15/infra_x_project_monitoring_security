loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
tableManager:
  retention_period: 90d
lokiCanary:
  enabled: false
test:
  enabled: false
deploymentMode: Monolithic

singleBinary:
  replicas: 1
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

gateway:
  enabled: false
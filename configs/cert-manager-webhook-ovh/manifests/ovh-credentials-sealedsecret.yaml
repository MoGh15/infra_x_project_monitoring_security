#GET /domain/zone/infra-x.cloud/*
#PUT /domain/zone/infra-x.cloud/*
#POST /domain/zone/infra-x.cloud/*
#DELETE /domain/zone/infra-x.cloud/*

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ovh-credentials
  namespace: cert-manager
spec:
  encryptedData:
    OVH_APPLICATION_KEY: 
    OVH_APPLICATION_SECRET: 
    OVH_CONSUMER_KEY: 
  template:
    metadata:
      name: ovh-credentials
      namespace: cert-manager
    type: Opaque

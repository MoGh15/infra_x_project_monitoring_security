# =============================================================================
# VORLAGE: OVH-API-Credentials als SealedSecret fuer cert-manager-webhook-ovh
# -----------------------------------------------------------------------------
# Dieses SealedSecret wird vom cert-manager-webhook-ovh ArgoCD-App (dritte
# Source: path configs/cert-manager-webhook-ovh/manifests) deployt. Der
# sealed-secrets-Controller (bootstrap) entschluesselt es im Cluster zum Secret
# "ovh-credentials" im Namespace "cert-manager", das der Webhook/ClusterIssuer
# via ovhAuthenticationRef referenziert.
#
# WICHTIG: Die unten stehenden encryptedData-Werte sind PLATZHALTER und muessen
# neu erzeugt werden (sie sind an Name + Namespace gebunden):
#
#   # 1) Plain-Secret lokal bauen (NICHT committen!):
#   kubectl -n cert-manager create secret generic ovh-credentials \
#     --from-literal=applicationKey=DEINE_APP_KEY \
#     --from-literal=applicationSecret=DEIN_APP_SECRET \
#     --from-literal=applicationConsumerKey=DEIN_CONSUMER_KEY \
#     --dry-run=client -o yaml > /tmp/ovh-cm.yaml
#
#   # 2) Mit dem Cluster-Public-Key versiegeln:
#   kubeseal --controller-name sealed-secrets-controller \
#            --controller-namespace sealed-secrets \
#            --format yaml < /tmp/ovh-cm.yaml > \
#            configs/cert-manager-webhook-ovh/manifests/ovh-credentials-sealedsecret.yaml
#
#   # 3) /tmp/ovh-cm.yaml loeschen, die versiegelte Datei committen.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ovh-credentials
  namespace: cert-manager
type: Opaque
data:
  applicationKey: "REPLACE_ME"
  applicationSecret: "REPLACE_ME"
  applicationConsumerKey: "REPLACE_ME"
alloy:
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod" 
      }
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_container_name"]
          target_label = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label = "node"
        }
         rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label = "app"
        }
      }
      loki.source.kubernetes "pods" {
         targets = discovery.relabel.pods.output
         forward_to = [loki.write.default.receiver]         
      }
      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // Traces: apps send OTLP to alloy.alloy.svc.cluster.local:4317 (gRPC) / :4318 (HTTP)
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.filter.drop_noise.input]
        }
      }
      // Drop health checks / Prometheus scrapes (actuator) and the Mongo ping of the health indicator
      otelcol.processor.filter "drop_noise" {
        error_mode = "ignore"
        traces {
          span = [
            `IsMatch(attributes["url.path"], "^/actuator")`,
            `IsMatch(attributes["http.target"], "^/actuator")`,
            `attributes["db.operation"] == "hello" or attributes["db.operation.name"] == "hello"`,
            // Everything on the Spring Boot management port (8081), e.g. orphaned Mongo spans of the health indicator
            `IsMatch(attributes["thread.name"], "^http-nio-8081-")`,
          ]
        }
        output {
          traces = [otelcol.processor.k8sattributes.default.input]
        }
      }
      otelcol.processor.k8sattributes "default" {
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.deployment.name",
            "k8s.node.name",
            "k8s.container.name",
          ]
        }
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.ip"
          }
        }
        pod_association {
          source {
            from = "connection"
          }
        }
        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }
      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tempo.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
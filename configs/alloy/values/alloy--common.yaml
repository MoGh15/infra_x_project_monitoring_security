# Common values for the standalone Alloy ArgoCD Application.
# Consumed by argocd/apps alloy Application via $values reference.
# Alloy runs as a DaemonSet and collects pod logs cluster-wide,
# forwarding them to Loki.

alloy:
  configMap:
    content: |-
      // Discover all pods in the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Attach useful metadata labels to each log stream.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Read container logs via the Kubernetes API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // Ship logs to Loki.
      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  # Alloy needs RBAC to list pods and read their logs.
  clustering:
    enabled: false

controller:
  type: daemonset

rbac:
  create: true

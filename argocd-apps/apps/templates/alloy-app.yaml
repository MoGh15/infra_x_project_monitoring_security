apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.15.0
      chart: alloy
      helm:
        valueFiles:
          - $myrepo/configs/alloy/values/alloy-values.yaml
    - repoURL: https://github.com/MoGh15/infra_x_project_monitoring_security.git
      targetRevision: main
      ref: myrepo
      
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

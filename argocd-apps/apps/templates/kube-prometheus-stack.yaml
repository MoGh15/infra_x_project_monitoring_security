apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 93.3.0
      chart: kube-prometheus-stack
      helm:
        valueFiles:
          - $myrepo/configs/kube-prometheus-stack/values/kube-prometheus-stack-values.yaml
          
    - repoURL: https://github.com/MoGh15/infra_x_project_monitoring_security.git
      targetRevision: main
      ref: myrepo

    - repoURL: https://github.com/MoGh15/infra_x_project_monitoring_security.git
      targetRevision: main
      path: configs/kube-prometheus-stack/manifests
      
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

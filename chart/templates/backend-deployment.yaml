apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: backend
    {{- include "praxis-form.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        # Eindeutig pro Release, damit Services keine Pods anderer Releases im Namespace treffen
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.backend.tracing.enabled }}
      # Kopiert den OpenTelemetry-Java-Agent in ein emptyDir, das der Backend-Container per -javaagent laedt.
      initContainers:
        - name: otel-agent
          image: {{ .Values.backend.tracing.agentImage | quote }}
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: otel-agent
          emptyDir: {}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: http-metrics
              containerPort: {{ .Values.backend.managementPort }}
          env:
            - name: MANAGEMENT_PORT
              value: {{ .Values.backend.managementPort | quote }}
            - name: MONGODB_URI
              value: {{ .Values.backend.env.MONGODB_URI | quote }}
            - name: JWT_EXP_MINUTES
              value: {{ .Values.backend.env.JWT_EXP_MINUTES | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-secret
                  key: JWT_SECRET
            - name: ADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-secret
                  key: ADMIN_DEFAULT_PASSWORD
            {{- if .Values.backend.tracing.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.backend.tracing.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.backend.tracing.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.backend.tracing.samplerRatio | quote }}
            # Metriken laufen ueber Actuator/Prometheus, Logs ueber Alloy/Loki
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Release.Namespace }},service.version={{ .Values.backend.image.tag }},deployment.environment.name={{ .Values.backend.tracing.environment }},k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE)"
            # trace_id/span_id in jede Logzeile schreiben (Grafana: Loki <-> Tempo)
            - name: LOGGING_PATTERN_CORRELATION
              value: "[trace_id=%X{trace_id} span_id=%X{span_id}] "
            {{- end }}
          {{- if .Values.backend.tracing.enabled }}
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http-metrics
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 15


apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: backend
    {{- include "praxis-form.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
    - name: http-metrics
      port: {{ .Values.backend.managementPort }}
      targetPort: http-metrics
      protocol: TCP
  selector:
    app: backend
    app.kubernetes.io/instance: {{ .Release.Name }}


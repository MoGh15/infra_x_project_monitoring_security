{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "praxis-form.labels" . | nindent 4 }}
  annotations:
    # cert-manager: triggert die automatische TLS-Zertifikatsausstellung (ingress-shim).
    # Der ClusterIssuer loest den ACME-DNS01-Challenge ueber den OVH-Webhook und legt
    # das Zertifikat im unten referenzierten tls.secretName ab.
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer | quote }}
    # external-dns: legt den A-Record fuer diesen Host automatisch in der OVH-Zone an.
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.global.domain | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: {{ .Release.Name }}-tls
      hosts:
        - {{ .Values.global.domain }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}


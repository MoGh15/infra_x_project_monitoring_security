# Default values for praxis-form

global:
  domain: praxis.infra-x.cloud
  # ClusterIssuer fuer cert-manager (OVH DNS01 Webhook). Muss im Cluster existieren.
  clusterIssuer: letsencrypt-ovh-prod

ingress:
  enabled: true

praxisHost: praxis.infra-x.cloud

# --- Backend ---
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/mogh15/infra_x_project_monitoring_security/backend
    # Git-Commit-SHA des gebauten Images (wie in .github/workflows/ci-cd.yml); "latest" zeigt auf dasselbe Image
    tag: 4fd2107ea90cc272e046f185bd470aff1147867d
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  # Actuator (health + prometheus) laeuft auf eigenem Port und wird NICHT ueber den Ingress veroeffentlicht.
  managementPort: 8081
  env:
    MONGODB_URI: mongodb://praxis-form-mongodb:27017/praxis
    JWT_EXP_MINUTES: "120"
  secrets:
    JWT_SECRET: CHANGE_ME_very_long_secret_at_least_32_chars
    ADMIN_DEFAULT_PASSWORD: CHANGE_ME
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # OpenTelemetry-Java-Agent (Auto-Instrumentierung: HTTP, Spring Security, MongoDB, WebClient)
  # Traces gehen an Alloy, das sie an Grafana Tempo weiterleitet.
  tracing:
    enabled: true
    agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.34.0
    otlpEndpoint: http://alloy.alloy.svc.cluster.local:4318
    serviceName: praxis-backend
    environment: production
    # Anteil der Requests, die getraced werden (1.0 = alle)
    samplerRatio: "1.0"

# --- Monitoring (kube-prometheus-stack / Grafana) ---
# Benoetigt die CRDs von kube-prometheus-stack (ServiceMonitor, PrometheusRule).
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    # Alert wenn eine Einreichung laenger als X Sekunden im Status NEW liegt (Default 24h)
    oldestNewSubmissionSeconds: 86400
    # Alert bei mehr als X fehlgeschlagenen Admin-Logins in 15 Minuten
    failedLoginsThreshold: 10
    # Alert wenn mehr als X Prozent der Einreichungen in 1h abgelehnt werden
    rejectionRatioPercent: 20
  grafanaDashboard:
    enabled: true
    # Der Grafana-Sidecar sucht ConfigMaps mit diesem Label in allen Namespaces
    label: grafana_dashboard
    labelValue: "1"
    folder: Praxis

# --- Frontend ---
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/mogh15/infra_x_project_monitoring_security/frontend
    # Git-Commit-SHA des gebauten Images (wie in .github/workflows/ci-cd.yml); "latest" zeigt auf dasselbe Image
    tag: 4fd2107ea90cc272e046f185bd470aff1147867d
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  env:
    API_URL: https://praxis.infra-x.cloud
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ingress:
    enabled: true

# --- MongoDB (Bitnami subchart) ---
mongodb:
  image:
    tag: latest
  enabled: true
  auth:
    enabled: false
  persistence:
    enabled: true
    size: 8Gi


app:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_very_long_secret_at_least_32_chars}
      expiration-minutes: ${JWT_EXP_MINUTES:120}
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:changeme}

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/praxis}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
server:
  port: 8080

management:
  # Separate port for actuator (health + prometheus) so it is not exposed via the public ingress.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: praxis


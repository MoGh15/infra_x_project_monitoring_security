# Values for the bootstrap app-of-apps chart.
# These Applications provision the cluster infrastructure that must exist BEFORE
# the main (argocd/apps) app-of-apps: the ingress controller, cert-manager with
# the OVH DNS01 webhook, and external-dns. Together they let sub-domains and their
# TLS certificates be created automatically in OVH.
#
# Ordering is controlled via ArgoCD sync-waves (lower runs first):
#   wave 0: sealed-secrets, ingress-nginx, cert-manager, external-dns
#   wave 1: cert-manager-webhook-ovh (needs cert-manager CRDs + the OVH ClusterIssuer)

# Git repository that holds this repo (chart sources + config values).
repo:
  url: https://github.com/MoGh15/infra_x_project_monitoring_security.git
  targetRevision: main

# ArgoCD project and destination defaults for all child Applications.
argocd:
  namespace: argocd
  project: default

destination:
  server: https://kubernetes.default.svc

# --- Infrastructure Helm-chart based Applications ---
# Each entry is rendered as a multi-source ArgoCD Application: the upstream Helm
# chart plus a $values reference to this git repo for the value file(s).
helmApps:
  sealedSecrets:
    enabled: true
    name: sealed-secrets
    namespace: sealed-secrets
    syncWave: "0"
    chart:
      repoURL: https://bitnami-labs.github.io/sealed-secrets
      name: sealed-secrets
      version: "2.18.6"
    valueFiles:
      - configs/sealed-secrets/values/sealed-secrets--common.yaml

  ingressNginx:
    enabled: true
    name: ingress-nginx
    namespace: ingress-nginx
    syncWave: "0"
    chart:
      repoURL: https://kubernetes.github.io/ingress-nginx
      name: ingress-nginx
      version: "4.15.1"
    valueFiles:
      - configs/ingress-nginx/values/ingress-nginx--common.yaml

  certManager:
    enabled: true
    name: cert-manager
    namespace: cert-manager
    syncWave: "0"
    chart:
      repoURL: https://charts.jetstack.io
      name: cert-manager
      version: "v1.19.6"
    valueFiles:
      - configs/cert-manager/values/cert-manager--common.yaml

  externalDns:
    enabled: true
    name: external-dns
    namespace: external-dns
    syncWave: "0"
    chart:
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      name: external-dns
      version: "1.23.0"
    valueFiles:
      - configs/external-dns/values/external-dns--common.yaml

  certManagerWebhookOvh:
    enabled: true
    name: cert-manager-webhook-ovh
    namespace: cert-manager
    syncWave: "1"
    chart:
      repoURL: https://aureq.github.io/cert-manager-webhook-ovh/
      name: cert-manager-webhook-ovh
      version: "0.9.19"
    valueFiles:
      - configs/cert-manager-webhook-ovh/values/cert-manager-webhook-ovh--common.yaml

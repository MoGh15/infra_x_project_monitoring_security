apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MoGh15/infra_x_project_monitoring_security.git
    targetRevision: main
    path: argocd-bootstrap/apps
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
